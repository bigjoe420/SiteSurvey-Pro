# =============================================================================
# SiteSurvey Pro — Deploy Web Installer (GitHub Pages)
# Publishes docs/ (the ESP Web Tools installer page) plus the binaries of the
# latest release to GitHub Pages. GitHub release assets do not send CORS
# headers, so the manifest cannot reference them directly — this workflow
# vendors the three .bin files into the Pages deployment instead. Binaries
# never touch git; they live only in the Pages artifact.
# =============================================================================

name: Deploy Web Installer

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/manifest.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy installer site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull firmware from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p firmware
          TAG=$(gh release view --json tagName --jq .tagName)
          echo "Bundling firmware from release $TAG"
          for f in bootloader.bin partition-table.bin SiteSurvey-Pro.bin; do
            gh release download "$TAG" --pattern "$f" --dir firmware --clobber
          done
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Stage site (page + manifest + firmware)
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp docs/index.html _site/
          cp firmware/*.bin _site/firmware/
          python3 - "$TAG" <<'EOF'
          import json, sys
          with open("docs/manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = sys.argv[1]
          with open("_site/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print("manifest stamped with", sys.argv[1])
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
